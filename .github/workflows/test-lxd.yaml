name: Test (LXD)

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "renovate/*"
      - "work/*"
  pull_request:
  workflow_dispatch:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-container:
    name: Build container (${{ matrix.distro }} - ${{ matrix.flavor }})
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # noble (24.04) - Ubuntu release Python 3.12
          - distro: noble
            flavor: other
            image: ubuntu-minimal:24.04
            setup_vars: "NO_JAVA=1 NO_PYTHON=1"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            flavor: python
            image: ubuntu-minimal:24.04
            setup_vars: "NO_JAVA=1 NO_PLUGIN=1"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            flavor: java
            image: ubuntu-minimal:24.04
            setup_vars: "NO_PYTHON=1 NO_PLUGIN=1"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"

          # jammy (22.04) - Ubuntu release Python 3.10
          - distro: jammy
            flavor: other
            image: ubuntu-minimal:22.04
            setup_vars: "NO_JAVA=1 NO_PYTHON=1"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: jammy
            flavor: python
            image: ubuntu-minimal:22.04
            setup_vars: "NO_JAVA=1 NO_PLUGIN=1"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: jammy
            flavor: java
            image: ubuntu-minimal:22.04
            setup_vars: "NO_PYTHON=1 NO_PLUGIN=1"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"

          # focal (20.04) - UV-provided Python 3.10
          - distro: focal
            flavor: other
            image: ubuntu-minimal:20.04
            setup_vars: "NO_JAVA=1 NO_PYTHON=1"
            python: "3.10"
            uv_downloads: "auto"
            uv_preference: "managed"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for recent container cache
        id: check-cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="lxd-container-${{ matrix.distro }}-${{ matrix.flavor }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-"
          echo "Checking cache for: $prefix"

          latest_cache=$(gh cache list --key "$prefix" --sort created_at --order desc --json key,createdAt --jq '.[0] // empty' 2>/dev/null || true)

          if [ -n "$latest_cache" ]; then
            key=$(echo "$latest_cache" | jq -r '.key')
            created_at=$(echo "$latest_cache" | jq -r '.createdAt')
            created_ts=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            now_ts=$(date +%s)
            age_seconds=$(( now_ts - created_ts ))
            one_week=604800 # 7 days in seconds

            echo "Found cache $key created at $created_at ($age_seconds seconds ago)"
            if [ "$age_seconds" -ge 0 ] && [ "$age_seconds" -le "$one_week" ]; then
              echo "Cache is within the last week. Using existing cache."
              echo "cache-valid=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Cache is older than one week. Rebuilding container."
            fi
          else
            echo "No existing cache found for $prefix."
          fi

          new_key="${prefix}$(date +%s)"
          echo "cache-valid=false" >> "$GITHUB_OUTPUT"
          echo "new-key=$new_key" >> "$GITHUB_OUTPUT"

      - name: Install LXD
        if: steps.check-cache.outputs.cache-valid != 'true'
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Spin up LXD container and set up tests
        if: steps.check-cache.outputs.cache-valid != 'true'
        run: |
          # Launch default LXD container
          lxc launch ${{ matrix.image }} test-container

          # Wait for container systemd and networking to be fully ready
          lxc exec test-container -- cloud-init status --wait || true
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Ensure user ubuntu exists with passwordless sudo
          lxc exec test-container -- sh -c 'id -u ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash -u 1000 ubuntu'
          lxc exec test-container -- sh -c 'echo "ubuntu ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ubuntu && chmod 0440 /etc/sudoers.d/ubuntu'

          # Install base dependencies needed to run make, python, and plugins
          lxc exec test-container -- apt-get update
          lxc exec test-container -- apt-get install -y --no-install-recommends sudo git make curl ca-certificates python3 python3-pip python3-venv python3-dev nodejs npm node-semver

          # Ensure snapd service and socket are ready for snaps installed by make
          lxc exec test-container -- systemctl start snapd snapd.socket || true
          for _ in $(seq 1 30); do
            if lxc exec test-container -- snap version >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Configure environment: Python version settings
          lxc exec test-container -- sh -c "echo 'CI=true' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'DEBIAN_FRONTEND=noninteractive' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'UV_PYTHON=${{ matrix.python }}' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'UV_PYTHON_DOWNLOADS=${{ matrix.uv_downloads }}' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'UV_PYTHON_PREFERENCE=${{ matrix.uv_preference }}' >> /etc/environment"

          # Trust repository paths globally for all users
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

          # Copy repository into container
          lxc exec test-container -- sudo -i -u ubuntu mkdir -p /home/ubuntu/craft-parts
          tar -cf - . | lxc exec test-container -- sudo -i -u ubuntu tar -xf - -C /home/ubuntu/craft-parts

          # Run make setup using configured Python
          lxc exec test-container -- sudo -i -u ubuntu env CI=true DEBIAN_FRONTEND=noninteractive UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" ${{ matrix.setup_vars }} make -C /home/ubuntu/craft-parts setup

          # Ensure snap binaries (rustup, chisel, uv) are discoverable on all paths
          lxc exec test-container -- sh -c "for bin in /snap/bin/*; do [ -e \"\$bin\" ] && ln -sf \"\$bin\" /usr/local/bin/ || true; done"

      - name: Export container
        if: steps.check-cache.outputs.cache-valid != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/lxd-cache"
          lxc stop test-container
          lxc export test-container "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-${{ matrix.flavor }}.tar.gz"

      - name: Upload container to cache
        if: steps.check-cache.outputs.cache-valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-${{ matrix.flavor }}.tar.gz
          key: ${{ steps.check-cache.outputs.new-key }}

  test-fast:
    name: Fast tests (${{ matrix.distro }})
    needs: build-container
    if: always() && needs.build-container.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: focal
            python: "3.10"
            uv_downloads: "never"
            uv_preference: "managed"
          - distro: jammy
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-other.tar.gz
          key: lxd-container-${{ matrix.distro }}-other-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-other-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          fail-on-cache-miss: true

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-other.tar.gz" test-container
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Sync latest code into container
          tar -cf - . | lxc exec test-container -- sudo -i -u ubuntu tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

      - name: Run fast tests (non-root)
        run: |
          lxc exec test-container -- sudo -i -u ubuntu env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-fast

  test-slow:
    name: Slow tests (${{ matrix.distro }} - ${{ matrix.suite }})
    needs: build-container
    if: always() && needs.build-container.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # noble (24.04) - Ubuntu release Python 3.12
          - distro: noble
            flavor: other
            suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            flavor: other
            suite: flaky
            markers: "flaky"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            flavor: java
            suite: java
            markers: "java"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            flavor: python
            suite: python
            markers: "python"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            flavor: other
            suite: other-plugins
            markers: "plugin"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"

          # jammy (22.04) - Ubuntu release Python 3.10
          - distro: jammy
            flavor: other
            suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: jammy
            flavor: other
            suite: flaky
            markers: "flaky"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: jammy
            flavor: java
            suite: java
            markers: "java"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: jammy
            flavor: python
            suite: python
            markers: "python"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: jammy
            flavor: other
            suite: other-plugins
            markers: "plugin"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"

          # focal (20.04) - UV-provided Python 3.10
          - distro: focal
            flavor: other
            suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
            python: "3.10"
            uv_downloads: "never"
            uv_preference: "managed"
          - distro: focal
            flavor: other
            suite: flaky
            markers: "flaky"
            python: "3.10"
            uv_downloads: "never"
            uv_preference: "managed"
          - distro: focal
            flavor: other
            suite: other-plugins
            markers: "plugin"
            python: "3.10"
            uv_downloads: "never"
            uv_preference: "managed"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-${{ matrix.flavor }}.tar.gz
          key: lxd-container-${{ matrix.distro }}-${{ matrix.flavor }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-${{ matrix.flavor }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          fail-on-cache-miss: true

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-${{ matrix.flavor }}.tar.gz" test-container
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Sync latest code into container
          tar -cf - . | lxc exec test-container -- sudo -i -u ubuntu tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

      - name: Run slow tests (non-root)
        run: |
          lxc exec test-container -- sudo -i -u ubuntu env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="--no-header -v -rN -m 'slow and (${{ matrix.markers }})'"

  test-requires-root:
    name: Requires root (${{ matrix.distro }} - ${{ matrix.speed }})
    needs: build-container
    if: always() && needs.build-container.result != 'cancelled'
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: noble
            speed: fast
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            speed: slow
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: focal
            speed: fast
            python: "3.10"
            uv_downloads: "never"
            uv_preference: "managed"
          - distro: focal
            speed: slow
            python: "3.10"
            uv_downloads: "never"
            uv_preference: "managed"
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-other.tar.gz
          key: lxd-container-${{ matrix.distro }}-other-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-other-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          fail-on-cache-miss: true

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}-other.tar.gz" test-container
          lxc config set test-container security.privileged true
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Sync latest code into container
          tar -cf - . | lxc exec test-container -- tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- git config --system --add safe.directory '*'

      - name: Run root tests
        run: |
          if [ "${{ matrix.speed }}" = "fast" ]; then
            lxc exec test-container -- env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="-m 'not slow and requires_root'"
          else
            lxc exec test-container -- env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="--no-header -v -rN -m 'slow and requires_root'"
          fi
