name: Test (LXD)

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "renovate/*"
      - "work/*"
  pull_request:
  workflow_dispatch:
  schedule:
    # Run every Monday at 00:00 UTC
    - cron: "0 0 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-container:
    name: Build container (${{ matrix.distro }})
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [focal, jammy, noble, resolute, stonking]
        include:
          - distro: focal
            lxd_channel: "5.0"
            python: "3.10"
            uv_downloads: "auto"
            uv_preference: "managed"
          - distro: jammy
            lxd_channel: "5.0"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: noble
            lxd_channel: "5.21"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: resolute
            lxd_channel: "6"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
          - distro: stonking
            lxd_channel: "latest"
            python: "/usr/bin/python3"
            uv_downloads: "never"
            uv_preference: "only-system"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for recent container cache
        id: check-cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-"
          echo "Checking cache for: $prefix"

          latest_cache=$(gh cache list --key "$prefix" --sort created_at --order desc --json key,createdAt --jq '.[0] // empty' 2>/dev/null || true)

          if [ -n "$latest_cache" ]; then
            key=$(echo "$latest_cache" | jq -r '.key')
            created_at=$(echo "$latest_cache" | jq -r '.createdAt')
            created_ts=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            now_ts=$(date +%s)
            age_seconds=$(( now_ts - created_ts ))
            one_week=604800 # 7 days in seconds

            echo "Found cache $key created at $created_at ($age_seconds seconds ago)"
            if [ "$age_seconds" -ge 0 ] && [ "$age_seconds" -le "$one_week" ]; then
              echo "Cache is within the last week. Using existing cache."
              echo "cache-valid=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Cache is older than one week. Rebuilding container."
            fi
          else
            echo "No existing cache found for $prefix."
          fi

          new_key="${prefix}$(date +%s)"
          echo "cache-valid=false" >> "$GITHUB_OUTPUT"
          echo "new-key=$new_key" >> "$GITHUB_OUTPUT"

      - name: Install LXD
        if: steps.check-cache.outputs.cache-valid != 'true'
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: ${{ matrix.lxd_channel }}
          preseed: |
            config: {}
            networks:
              - name: lxdbr0
                type: bridge
                config:
                  ipv4.address: auto
                  ipv6.address: auto
            storage_pools:
              - name: default
                driver: dir
            profiles:
              - name: default
                devices:
                  root:
                    path: /
                    pool: default
                    type: disk
                  eth0:
                    name: eth0
                    network: lxdbr0
                    type: nic

      - name: Spin up LXD container and set up tests
        if: steps.check-cache.outputs.cache-valid != 'true'
        run: |
          # Launch default LXD container
          lxc launch ubuntu-minimal:${{ matrix.distro }} test-container

          # Wait for container systemd and networking to be fully ready
          lxc exec test-container -- cloud-init status --wait || true
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Ensure user ubuntu exists with passwordless sudo and world-traversable home for snaps
          lxc exec test-container -- sh -c 'id -u ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash -u 1000 ubuntu'
          lxc exec test-container -- sh -c 'echo "ubuntu ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ubuntu && chmod 0440 /etc/sudoers.d/ubuntu'
          lxc exec test-container -- chmod 755 /home/ubuntu

          # Ensure systemd-logind and user session are active for non-root snaps
          lxc exec test-container -- systemctl start systemd-logind || true
          lxc exec test-container -- loginctl enable-linger ubuntu || true

          # Install base dependencies needed to run make, python, and plugins
          lxc exec test-container -- apt-get update
          lxc exec test-container -- apt-get install -y --no-install-recommends sudo git make curl ca-certificates python3 python3-pip python3-venv python3-dev nodejs npm node-semver

          # Prevent AppArmor parser protocol incompatibility on older distros with modern host kernels
          lxc exec test-container -- sh -c 'if [ -f /usr/sbin/apparmor_parser ] && [ ! -f /usr/sbin/apparmor_parser.real ]; then mv /usr/sbin/apparmor_parser /usr/sbin/apparmor_parser.real && printf "#!/bin/sh\n/usr/sbin/apparmor_parser.real \"\$@\" || exit 0\n" > /usr/sbin/apparmor_parser && chmod +x /usr/sbin/apparmor_parser; fi'

          # Ensure snapd service and socket are ready for snaps installed by make
          for _ in $(seq 1 30); do
            lxc exec test-container -- systemctl restart snapd.socket snapd.service >/dev/null 2>&1 || true
            if lxc exec test-container -- sh -c 'snap version 2>/dev/null | grep -qE "^snapd +[0-9]"'; then
              break
            fi
            sleep 2
          done
          lxc exec test-container -- sh -c 'snap version 2>/dev/null | grep -qE "^snapd +[0-9]"' || {
            lxc exec test-container -- systemctl status snapd.service --no-pager || true
            lxc exec test-container -- journalctl -u snapd.service -n 50 --no-pager || true
            exit 1
          }
          lxc exec test-container -- snap version

          # Configure environment: Python and tool settings
          lxc exec test-container -- sh -c "echo 'CI=true' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'DEBIAN_FRONTEND=noninteractive' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'UV_PYTHON=${{ matrix.python }}' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'UV_PYTHON_DOWNLOADS=${{ matrix.uv_downloads }}' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'UV_PYTHON_PREFERENCE=${{ matrix.uv_preference }}' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'DOTNET_GCHeapHardLimit=536870912' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'DOTNET_EnableWriteXorExecute=0' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'DOTNET_CLI_TELEMETRY_OPTOUT=1' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'TMPDIR=/var/tmp' >> /etc/environment"

          # Trust repository paths globally for all users
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

          # Copy repository into container
          lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- mkdir -p /home/ubuntu/craft-parts
          tar -cf - . | lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- tar -xf - -C /home/ubuntu/craft-parts

          # Run make setup and setup-tests using configured Python
          lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- env CI=true DEBIAN_FRONTEND=noninteractive UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" make -C /home/ubuntu/craft-parts setup
          lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- env CI=true DEBIAN_FRONTEND=noninteractive UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="${{ matrix.uv_downloads }}" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" make -C /home/ubuntu/craft-parts setup-tests

          # Ensure /etc/lsb-release exists for chisel compatibility on newer releases
          lxc exec test-container -- sh -c "
            if [ ! -f /etc/lsb-release ] && [ -f /etc/os-release ]; then
              . /etc/os-release
              printf 'DISTRIB_ID=Ubuntu\nDISTRIB_RELEASE=%s\nDISTRIB_CODENAME=%s\nDISTRIB_DESCRIPTION=\"%s\"\n' \"\$VERSION_ID\" \"\$VERSION_CODENAME\" \"\$PRETTY_NAME\" > /etc/lsb-release
            fi
          "

          # On resolute and stonking, set SUID for fuse-overlayfs and umount to avoid libfuse 3.18 bug
          if [ "${{ matrix.distro }}" = "resolute" ] || [ "${{ matrix.distro }}" = "stonking" ]; then
            lxc exec test-container -- chmod 4755 /usr/bin/fuse-overlayfs /bin/umount /usr/bin/umount 2>/dev/null || true
          fi

          # Ensure python3 points to managed python3.10 on focal
          lxc exec test-container -- sh -c "
            if [ -d /home/ubuntu/.local/share/uv/python ]; then
              py310=\$(find /home/ubuntu/.local/share/uv/python -name python3.10 -type f 2>/dev/null | head -n 1)
              if [ -n \"\$py310\" ]; then
                ln -sf \"\$py310\" /usr/local/bin/python3
              fi
            fi
          "

          # Ensure snap and user binaries (rustup, chisel, uv, poetry) are discoverable on all paths
          lxc exec test-container -- sh -c "for bin in /snap/bin/* /home/ubuntu/.local/bin/*; do [ -e \"\$bin\" ] && ln -sf \"\$bin\" /usr/local/bin/ || true; done"

      - name: Export container
        if: steps.check-cache.outputs.cache-valid != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/lxd-cache"
          lxc exec test-container -- apt clean || true
          lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- uv cache clean || true
          lxc exec test-container -- sh -c 'rm -rf /tmp/* /tmp/.* 2>/dev/null || true'
          lxc stop test-container
          lxc config set backups.compression_algorithm zstd
          lxc export test-container "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst"

      - name: Upload container to cache
        if: steps.check-cache.outputs.cache-valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst
          key: ${{ steps.check-cache.outputs.new-key }}

  test-fast:
    name: Fast tests (${{ matrix.distro }})
    needs: build-container
    if: always() && needs.build-container.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [focal, jammy, noble, resolute, stonking]
        include:
          - distro: focal
            lxd_channel: "5.0"
            python: "3.10"
            uv_preference: "managed"
          - distro: jammy
            lxd_channel: "5.0"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: noble
            lxd_channel: "5.21"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: resolute
            lxd_channel: "6"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: stonking
            lxd_channel: "latest"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: ${{ matrix.lxd_channel }}
          preseed: |
            config: {}
            networks:
              - name: lxdbr0
                type: bridge
                config:
                  ipv4.address: auto
                  ipv6.address: auto
            storage_pools:
              - name: default
                driver: dir
            profiles:
              - name: default
                devices:
                  root:
                    path: /
                    pool: default
                    type: disk
                  eth0:
                    name: eth0
                    network: lxdbr0
                    type: nic

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst
          key: lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          fail-on-cache-miss: true

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst" test-container
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true
          lxc exec test-container -- systemctl start systemd-logind || true
          lxc exec test-container -- loginctl enable-linger ubuntu || true

          # Wait for container networking and DNS resolution
          for _ in $(seq 1 30); do
            if lxc exec test-container -- getent hosts pypi.org >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Prevent AppArmor parser protocol incompatibility on older distros with modern host kernels
          lxc exec test-container -- sh -c 'if [ -f /usr/sbin/apparmor_parser ] && [ ! -f /usr/sbin/apparmor_parser.real ]; then mv /usr/sbin/apparmor_parser /usr/sbin/apparmor_parser.real && printf "#!/bin/sh\n/usr/sbin/apparmor_parser.real \"\$@\" || exit 0\n" > /usr/sbin/apparmor_parser && chmod +x /usr/sbin/apparmor_parser; fi'

          # Ensure snapd service and socket are ready
          lxc exec test-container -- systemctl start snapd.socket snapd.service || true
          for _ in $(seq 1 60); do
            if lxc exec test-container -- sh -c 'snap version 2>/dev/null | grep -qE "^snapd +[0-9]"'; then
              break
            fi
            sleep 1
          done

          # Clean temp directory to prevent disk exhaustion
          lxc exec test-container -- sh -c 'rm -rf /tmp/* /tmp/.* 2>/dev/null || true'

          # Sync latest code into container
          tar -cf - . | lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- git config --system --add safe.directory '*'

      - name: Run fast tests (non-root)
        run: |
          lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="never" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-fast

  test-slow:
    name: Slow tests (${{ matrix.distro }} - ${{ matrix.suite }})
    needs: build-container
    if: always() && needs.build-container.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [focal, jammy, noble, resolute, stonking]
        suite: [common, flaky, java, python, other-plugins]
        include:
          - distro: focal
            lxd_channel: "5.0"
            python: "3.10"
            uv_preference: "managed"
          - distro: jammy
            lxd_channel: "5.0"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: noble
            lxd_channel: "5.21"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: resolute
            lxd_channel: "6"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: stonking
            lxd_channel: "latest"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
          - suite: flaky
            markers: "flaky"
          - suite: java
            markers: "java"
          - suite: python
            markers: "python"
          - suite: other-plugins
            markers: "plugin"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: ${{ matrix.lxd_channel }}
          preseed: |
            config: {}
            networks:
              - name: lxdbr0
                type: bridge
                config:
                  ipv4.address: auto
                  ipv6.address: auto
            storage_pools:
              - name: default
                driver: dir
            profiles:
              - name: default
                devices:
                  root:
                    path: /
                    pool: default
                    type: disk
                  eth0:
                    name: eth0
                    network: lxdbr0
                    type: nic

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst
          key: lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          fail-on-cache-miss: true

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst" test-container
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true
          lxc exec test-container -- systemctl start systemd-logind || true
          lxc exec test-container -- loginctl enable-linger ubuntu || true

          # Wait for container networking and DNS resolution
          for _ in $(seq 1 30); do
            if lxc exec test-container -- getent hosts pypi.org >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Prevent AppArmor parser protocol incompatibility on older distros with modern host kernels
          lxc exec test-container -- sh -c 'if [ -f /usr/sbin/apparmor_parser ] && [ ! -f /usr/sbin/apparmor_parser.real ]; then mv /usr/sbin/apparmor_parser /usr/sbin/apparmor_parser.real && printf "#!/bin/sh\n/usr/sbin/apparmor_parser.real \"\$@\" || exit 0\n" > /usr/sbin/apparmor_parser && chmod +x /usr/sbin/apparmor_parser; fi'

          # Ensure snapd service and socket are ready
          lxc exec test-container -- systemctl start snapd.socket snapd.service || true
          for _ in $(seq 1 60); do
            if lxc exec test-container -- sh -c 'snap version 2>/dev/null | grep -qE "^snapd +[0-9]"'; then
              break
            fi
            sleep 1
          done

          # Clean temp directory to prevent disk exhaustion
          lxc exec test-container -- sh -c 'rm -rf /tmp/* /tmp/.* 2>/dev/null || true'

          # Sync latest code into container
          tar -cf - . | lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- git config --system --add safe.directory '*'

      - name: Run slow tests (non-root)
        run: |
          lxc exec test-container --user 1000 --group 1000 --cwd /home/ubuntu --env HOME=/home/ubuntu --env USER=ubuntu -- env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="never" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="--no-header -v -rN -m 'slow and (${{ matrix.markers }})'"

  test-requires-root:
    name: Requires root (${{ matrix.distro }} - ${{ matrix.speed }})
    needs: build-container
    if: always() && needs.build-container.result != 'cancelled'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [focal, jammy, noble, resolute, stonking]
        speed: [fast, slow]
        include:
          - distro: focal
            lxd_channel: "5.0"
            python: "3.10"
            uv_preference: "managed"
          - distro: jammy
            lxd_channel: "5.0"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: noble
            lxd_channel: "5.21"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: resolute
            lxd_channel: "6"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
          - distro: stonking
            lxd_channel: "latest"
            python: "/usr/bin/python3"
            uv_preference: "only-system"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache || true

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: ${{ matrix.lxd_channel }}
          preseed: |
            config: {}
            networks:
              - name: lxdbr0
                type: bridge
                config:
                  ipv4.address: auto
                  ipv6.address: auto
            storage_pools:
              - name: default
                driver: dir
            profiles:
              - name: default
                devices:
                  root:
                    path: /
                    pool: default
                    type: disk
                  eth0:
                    name: eth0
                    network: lxdbr0
                    type: nic

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst
          key: lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-${{ runner.arch }}-${{ hashFiles('Makefile', 'uv.lock', '.github/workflows/test-lxd.yaml') }}-
          fail-on-cache-miss: true

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.zst" test-container
          lxc config set test-container security.syscalls.intercept.mknod true
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true
          lxc exec test-container -- systemctl start systemd-logind || true
          lxc exec test-container -- loginctl enable-linger ubuntu || true

          # Wait for container networking and DNS resolution
          for _ in $(seq 1 30); do
            if lxc exec test-container -- getent hosts pypi.org >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          # Prevent AppArmor parser protocol incompatibility on older distros with modern host kernels
          lxc exec test-container -- sh -c 'if [ -f /usr/sbin/apparmor_parser ] && [ ! -f /usr/sbin/apparmor_parser.real ]; then mv /usr/sbin/apparmor_parser /usr/sbin/apparmor_parser.real && printf "#!/bin/sh\n/usr/sbin/apparmor_parser.real \"\$@\" || exit 0\n" > /usr/sbin/apparmor_parser && chmod +x /usr/sbin/apparmor_parser; fi'

          # Ensure snapd service and socket are ready
          lxc exec test-container -- systemctl start snapd.socket snapd.service || true
          for _ in $(seq 1 60); do
            if lxc exec test-container -- sh -c 'snap version 2>/dev/null | grep -qE "^snapd +[0-9]"'; then
              break
            fi
            sleep 1
          done

          # Clean temp directory to prevent disk exhaustion
          lxc exec test-container -- sh -c 'rm -rf /tmp/* /tmp/.* 2>/dev/null || true'

          # Sync latest code into container
          tar -cf - . | lxc exec test-container -- tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- git config --system --add safe.directory '*'

      - name: Run root tests
        run: |
          if [ "${{ matrix.speed }}" = "fast" ]; then
            lxc exec test-container -- env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="never" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="-m 'not slow and requires_root'"
          else
            lxc exec test-container -- env CI=true UV_PYTHON="${{ matrix.python }}" UV_PYTHON_DOWNLOADS="never" UV_PYTHON_PREFERENCE="${{ matrix.uv_preference }}" PATH="/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="--no-header -v -rN -m 'slow and requires_root'"
          fi
