name: Test (LXD)

on:
  push:
    branches:
      - "main"
      - "feature/*"
      - "hotfix/*"
      - "release/*"
      - "renovate/*"
      - "work/*"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-container:
    name: Build container (${{ matrix.distro }})
    runs-on: ubuntu-24.04
    permissions:
      actions: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - distro: focal
            image: ubuntu:20.04
            setup_vars: "NO_JAVA=1 NO_PYTHON=1"
          - distro: jammy
            image: ubuntu:22.04
            setup_vars: ""
          - distro: noble
            image: ubuntu:24.04
            setup_vars: ""
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check for recent container cache
        id: check-cache
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prefix="lxd-container-${{ matrix.distro }}-${{ runner.arch }}-"
          echo "Checking cache for: $prefix"

          latest_cache=$(gh cache list --key "$prefix" --sort created_at --order desc --json key,createdAt --jq '.[0] // empty' 2>/dev/null || true)

          if [ -n "$latest_cache" ]; then
            key=$(echo "$latest_cache" | jq -r '.key')
            created_at=$(echo "$latest_cache" | jq -r '.createdAt')
            created_ts=$(date -d "$created_at" +%s 2>/dev/null || echo 0)
            now_ts=$(date +%s)
            age_seconds=$(( now_ts - created_ts ))
            one_week=604800 # 7 days in seconds

            echo "Found cache $key created at $created_at ($age_seconds seconds ago)"
            if [ "$age_seconds" -ge 0 ] && [ "$age_seconds" -le "$one_week" ]; then
              echo "Cache is within the last week. Using existing cache."
              echo "cache-valid=true" >> "$GITHUB_OUTPUT"
              exit 0
            else
              echo "Cache is older than one week. Rebuilding container."
            fi
          else
            echo "No existing cache found for $prefix."
          fi

          new_key="${prefix}$(date +%s)"
          echo "cache-valid=false" >> "$GITHUB_OUTPUT"
          echo "new-key=$new_key" >> "$GITHUB_OUTPUT"

      - name: Install LXD
        if: steps.check-cache.outputs.cache-valid != 'true'
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Spin up LXD container and set up tests
        if: steps.check-cache.outputs.cache-valid != 'true'
        run: |
          # Launch container with nesting and privilege enabled for snapd and special device files
          lxc launch ${{ matrix.image }} test-container -c security.nesting=true -c security.privileged=true

          # Wait for container systemd and networking to be fully ready
          lxc exec test-container -- cloud-init status --wait || true
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Ensure user ubuntu exists with passwordless sudo
          lxc exec test-container -- sh -c 'id -u ubuntu >/dev/null 2>&1 || useradd -m -s /bin/bash -u 1000 ubuntu'
          lxc exec test-container -- sh -c 'echo "ubuntu ALL=(ALL) NOPASSWD:ALL" > /etc/sudoers.d/ubuntu && chmod 0440 /etc/sudoers.d/ubuntu'

          # Install base dependencies needed to run make and plugins
          lxc exec test-container -- sudo apt-get update
          lxc exec test-container -- sudo apt-get install -y --no-install-recommends git make curl ca-certificates python3-pip npm node-semver

          # Wait for snapd to be ready
          for _ in $(seq 1 30); do
            if lxc exec test-container -- snap version >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          # Install node snap for npm plugin integration tests
          lxc exec test-container -- sudo snap install --classic node

          # Symlink snap binaries to /usr/local/bin to be discovered by subprocesses
          lxc exec test-container -- sh -c "for bin in /snap/bin/*; do [ -e \"\$bin\" ] && ln -sf \"\$bin\" /usr/local/bin/ || true; done"

          # Ensure /snap/bin is in PATH and CI environment is set for all shells
          lxc exec test-container -- sh -c "grep -q '/snap/bin' /etc/environment || echo 'PATH=/snap/bin:\$PATH' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'CI=true' >> /etc/environment"
          lxc exec test-container -- sh -c "echo 'DEBIAN_FRONTEND=noninteractive' >> /etc/environment"

          # Trust repository paths globally for all users
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

          # Copy repository into container
          lxc exec test-container -- sudo -i -u ubuntu mkdir -p /home/ubuntu/craft-parts
          tar -cf - . | lxc exec test-container -- sudo -i -u ubuntu tar -xf - -C /home/ubuntu/craft-parts

          # Run make setup
          lxc exec test-container -- sudo -i -u ubuntu env CI=true DEBIAN_FRONTEND=noninteractive ${{ matrix.setup_vars }} make -C /home/ubuntu/craft-parts setup

          # Ensure uv is easily discoverable on all paths
          lxc exec test-container -- sh -c 'ln -sf /snap/bin/uv /usr/local/bin/uv || true'

      - name: Export container
        if: steps.check-cache.outputs.cache-valid != 'true'
        run: |
          mkdir -p "${{ runner.temp }}/lxd-cache"
          lxc stop test-container
          lxc export test-container "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.gz"

      - name: Upload container to cache
        if: steps.check-cache.outputs.cache-valid != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.gz
          key: ${{ steps.check-cache.outputs.new-key }}

  test-fast:
    name: Fast tests (${{ matrix.distro }})
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        distro: [focal, jammy, noble]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.gz
          key: lxd-container-${{ matrix.distro }}-${{ runner.arch }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-${{ runner.arch }}-
          fail-on-cache-miss: true

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.gz" test-container
          lxc config set test-container security.nesting true || true
          lxc config set test-container security.privileged true || true
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Sync latest code into container
          tar -cf - . | lxc exec test-container -- sudo -i -u ubuntu tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

      - name: Run fast tests
        run: |
          lxc exec test-container -- sudo -i -u ubuntu env CI=true make -C /home/ubuntu/craft-parts test-fast
          lxc exec test-container -- sudo -i -u ubuntu sudo env CI=true "PATH=/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="-m 'not slow and requires_root'"

  test-slow:
    name: Slow tests (${{ matrix.distro }} - ${{ matrix.suite }})
    needs: build-container
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # noble (24.04)
          - distro: noble
            suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
            sudo: false
          - distro: noble
            suite: flaky
            markers: "flaky"
            sudo: false
          - distro: noble
            suite: java
            markers: "java"
            sudo: false
          - distro: noble
            suite: python
            markers: "python"
            sudo: false
          - distro: noble
            suite: other-plugins
            markers: "plugin"
            sudo: false
          - distro: noble
            suite: requires-root
            markers: "requires_root"
            sudo: true

          # jammy (22.04)
          - distro: jammy
            suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
            sudo: false
          - distro: jammy
            suite: flaky
            markers: "flaky"
            sudo: false
          - distro: jammy
            suite: java
            markers: "java"
            sudo: false
          - distro: jammy
            suite: python
            markers: "python"
            sudo: false
          - distro: jammy
            suite: other-plugins
            markers: "plugin"
            sudo: false

          # focal (20.04)
          - distro: focal
            suite: common
            markers: "not java and not python and not plugin and not flaky and not requires_root"
            sudo: false
          - distro: focal
            suite: flaky
            markers: "flaky"
            sudo: false
          - distro: focal
            suite: other-plugins
            markers: "plugin"
            sudo: false
          - distro: focal
            suite: requires-root
            markers: "requires_root"
            sudo: true
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Restore container from cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.gz
          key: lxd-container-${{ matrix.distro }}-${{ runner.arch }}-
          restore-keys: |
            lxd-container-${{ matrix.distro }}-${{ runner.arch }}-
          fail-on-cache-miss: true

      - name: Install LXD
        uses: canonical/setup-lxd@8c6a87bfb56aa48f3fb9b830baa18562d8bfd4ee # v1
        with:
          channel: 5.21/candidate

      - name: Import and start container
        run: |
          lxc import "${{ runner.temp }}/lxd-cache/${{ matrix.distro }}.tar.gz" test-container
          lxc config set test-container security.nesting true || true
          lxc config set test-container security.privileged true || true
          lxc start test-container
          lxc exec test-container -- systemctl is-system-running --wait || true

          # Sync latest code into container
          tar -cf - . | lxc exec test-container -- sudo -i -u ubuntu tar -xf - -C /home/ubuntu/craft-parts
          lxc exec test-container -- sudo git config --system --add safe.directory '*'

      - name: Run slow tests
        run: |
          if [ "${{ matrix.sudo }}" = "true" ]; then
            lxc exec test-container -- sudo -i -u ubuntu sudo env CI=true "PATH=/snap/bin:$PATH" make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="--no-header -v -rN -m 'slow and (${{ matrix.markers }})'"
          else
            lxc exec test-container -- sudo -i -u ubuntu env CI=true make -C /home/ubuntu/craft-parts test-coverage PYTEST_ADDOPTS="--no-header -v -rN -m 'slow and (${{ matrix.markers }})'"
          fi
